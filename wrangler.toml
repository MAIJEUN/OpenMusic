# 하나의 Worker가 웹 앱(정적 파일)과 API(/api/*)를 함께 제공한다.
# 주소: https://openmusic.<계정 서브도메인>.workers.dev
name = "openmusic"
main = "worker/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 배포 전에 `npm run build`로 dist를 만들어야 한다.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[alias]
"youtubei.js" = "youtubei.js/cf-worker"

[vars]
YT_LANG = "ko"
YT_LOCATION = "KR"
