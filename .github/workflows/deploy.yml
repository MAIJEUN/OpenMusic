# main 브랜치에 푸시하면
#   1) 웹 앱 + API를 Cloudflare Worker 하나로 배포하고 (https://openmusic.<서브도메인>.workers.dev)
#   2) 같은 웹 앱을 GitHub Pages에도 배포한다 (API는 1번 Worker를 사용).
#
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# (선택) 저장소 Variables: API_BASE_URL — Worker 주소를 직접 지정하고 싶을 때
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  worker:
    name: Deploy site + API (Cloudflare Worker)
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Worker가 같은 주소에서 웹 앱을 제공하므로 경로는 /, API 주소는 비워 둔다(같은 출처)
      - name: Build web app
        run: npm run build
        env:
          VITE_BASE: /
          VITE_API_BASE: ''
      - name: Deploy worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Find worker URL
        id: url
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          url="${{ vars.API_BASE_URL }}"
          if [ -z "$url" ]; then url="$DEPLOY_URL"; fi
          if [ -z "$url" ]; then url=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1); fi
          if [ -z "$url" ]; then
            echo "::error::Worker 주소를 찾지 못했습니다. 저장소 Variables에 API_BASE_URL을 설정해 주세요."
            exit 1
          fi
          echo "Worker URL: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # 처음 배포한 workers.dev 주소는 연결되기까지 잠시 걸릴 수 있어서 몇 번 다시 시도한다.
      # 끝까지 실패해도 경고만 남기고 웹 배포는 계속 진행한다.
      - name: Smoke test
        env:
          BASE: ${{ steps.url.outputs.url }}
        run: |
          for i in $(seq 1 12); do
            api=$(curl -sS -o api.txt -w '%{http_code}' "$BASE/api/config" || echo 000)
            web=$(curl -sS -o web.txt -w '%{http_code}' "$BASE/playlist?list=test" || echo 000)
            if [ "$api" = "200" ] && [ "$web" = "200" ] && grep -q 'id="root"' web.txt; then
              echo "API OK: $(cat api.txt)"
              echo "웹 앱 OK: $BASE"
              exit 0
            fi
            echo "시도 $i: API HTTP $api / 웹 HTTP $web — $(head -c 200 api.txt 2>/dev/null)"
            sleep 15
          done
          echo "::warning::$BASE 가 아직 응답하지 않습니다. 몇 분 뒤 브라우저로 열어 확인해 주세요."

  pages:
    name: Deploy web (GitHub Pages)
    needs: worker
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pages 주소의 경로를 알아낸다: 기본 주소면 "/OpenMusic", 사용자 도메인(예: openmusic.kro.kr)이면 ""
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_API_BASE: ${{ needs.worker.outputs.url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
