# 임시: 자막 조회 진단 (확인 후 삭제)
name: Captions probe
on:
  push:
    branches: [claude/festive-goldberg-2ih8re]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/captions-probe.ts dQw4w9WgXcQ a.en .ja 2>&1 | grep PROBE
