# 임시: 가사 조회 진단 (확인 후 삭제)
name: Lyrics probe
on:
  push:
    branches: [claude/festive-goldberg-2ih8re]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/lyrics-probe.ts 2>&1 | grep PROBE
