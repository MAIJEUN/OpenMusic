# 임시 진단 (확인 후 삭제)
name: External sources probe
on:
  push:
    branches: [claude/festive-goldberg-2ih8re]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: |
          npx tsx server/node.ts > server.log 2>&1 &
          SERVER=$!
          sleep 6
          timeout 180 node scripts/probe/browser.mjs 2>&1 | grep PROBE || true
          kill $SERVER || true
      - run: npx tsx scripts/probe/ext.ts 2>&1 | grep PROBE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: probe-*.png
      - run: tail -30 server.log
        if: always()
